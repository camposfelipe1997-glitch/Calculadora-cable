<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Eléctrico</title>
    <style>
        :root { --primary: #0ea5e9; --background: #0f172a; --surface: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #22c55e; }
        body { font-family: system-ui, sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { background: var(--surface); padding: 24px; border-radius: 20px; width: 100%; max-width: 420px; box-sizing: border-box; }
        h1 { font-size: 1.6rem; text-align: center; color: var(--primary); }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
        input { width: 100%; padding: 12px; background: #334155; border: 2px solid #475569; border-radius: 10px; font-size: 1rem; color: white; box-sizing: border-box; }
        button { width: 100%; background-color: var(--primary); color: #0f172a; border: none; padding: 14px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .result-box { margin-top: 24px; padding: 20px; background-color: #0f172a; border: 1px solid #334155; border-radius: 12px; display: none; }
        .result-item { font-size: 1rem; margin: 10px 0; display: flex; justify-content: space-between; }
        .accent { font-weight: bold; color: var(--text); }
        .price-total { margin-top: 16px; padding-top: 14px; border-top: 2px dashed #334155; font-size: 1.3rem; color: var(--accent); }
    </style>
</head>
<body>
<div class="app-container">
    <h1>⚡ Cubicación Eléctrica</h1>
    <div class="input-group"><label>Superficie de la casa (m²):</label><input type="number" id="metrosCasas" placeholder="Ej. 90"></div>
    <div class="input-group"><label>Puntos de luz (Techo/Pared):</label><input type="number" id="puntosLuz" placeholder="Ej. 15"></div>
    <div class="input-group"><label>Puntos de encendido (Interruptores):</label><input type="number" id="puntosEncendido" placeholder="Ej. 18"></div>
    <button onclick="calcular()">Calcular Presupuesto</button>
    <div class="result-box" id="resultado">
        <div class="result-item"><span>Cable necesario:</span><span class="accent"><span id="tM">0</span> m (<span id="tR">0</span> rollos)</span></div>
        <div class="result-item"><span>Costo cables:</span><span class="accent"><span id="cC">0</span>€</span></div>
        <div class="result-item"><span>Mecanismos y cajas:</span><span class="accent"><span id="cM">0</span>€</span></div>
        <div class="result-item price-total"><span>Total Materiales:</span><span><span id="cT">0</span>€</span></div>
    </div>
</div>
<script>
    function calcular() {
        const m2 = parseFloat(document.getElementById('metrosCasas').value) || 0;
        const luces = parseInt(document.getElementById('puntosLuz').value) || 0;
        const enc = parseInt(document.getElementById('puntosEncendido').value) || 0;
        if (m2 <= 0 && luces <= 0 && enc <= 0) return alert("Introduce datos");
        const totalMetros = (m2 * 2) + (luces * 5) + (enc * 3);
        const totalRollos = Math.ceil(totalMetros / 100);
        const cCable = totalRollos * 25;
        const cMec = (luces + enc) * 8;
        const cTotal = cCable + cMec + Math.round((cCable + cMec) * 0.15);
        document.getElementById('tM').innerText = totalMetros;
        document.getElementById('tR').innerText = totalRollos;
        document.getElementById('cC').innerText = cCable;
        document.getElementById('cM').innerText = cMec;
        document.getElementById('cT').innerText = cTotal;
        document.getElementById('resultado').style.display = 'block';
    }
</script>
</body>
</html>
